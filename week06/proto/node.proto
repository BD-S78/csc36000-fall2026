syntax = "proto3";

package csc36000;

// **Do not edit this file.** The gRPC service and messages are provided.
// Key/value node. Keys and values are bytes.

message Modes {
  string partitioning = 1;
  string replication = 2;
  string write_completion = 3;
  string leader_replication = 4;
  string conflicts = 5;
  string request_routing = 6;
  string leader_election = 7;
  string session_models = 8;
  string processing_guarantees = 9;
  string resume = 10;
  string atomic_commit = 11;
}

message WriteRequest {
  bytes key = 1;
  bytes value = 2;
  string session_id = 3;
  Modes modes = 4;
  string idempotency_key = 5;
  int32 hop = 6;
}

message WriteResponse {
  bool ok = 1;
  string error = 2;
  string owner = 3;
  repeated string acked_by = 4;
}

message ReadRequest {
  bytes key = 1;
  string session_id = 2;
  Modes modes = 3;
  int32 hop = 4;
}

message ReadResponse {
  bool ok = 1;
  string error = 2;
  bytes value = 3;
  bool found = 4;
  string served_by = 5;
}

message AddNodeRequest {
  string node_id = 1;
  string host = 2;
  int32 port = 3;
  Modes modes = 4;
  bytes pin_key = 5;
}

message RebalanceRequest {
  Modes modes = 1;
}

message FaultState {
  bool pause = 1;
  int32 delay_ms = 2;
  repeated string drop_to = 3;
}

message StatusRequest {}

message StatusResponse {
  bool ok = 1;
  string node_id = 2;
  string leader = 3;
  int32 term = 4;
  repeated string peers = 5;
  FaultState faults = 6;
  int32 key_count = 7;
  map<string, string> owners = 8;
  map<string, int32> keys_per_node = 9;
}

message FaultRequest {
  bool pause = 1;
  bool set_pause = 2;
  int32 delay_ms = 3;
  bool set_delay = 4;
  repeated string drop_to = 5;
  bool set_drop_to = 6;
  bool isolate = 7;
  bool set_isolate = 8;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
  string node_id = 2;
}

message RunStep {
  bytes key = 1;
  bytes value = 2;
}

message RunStartRequest {
  string run_id = 1;
  Modes modes = 2;
  repeated RunStep steps = 3;
}

message RunResponse {
  bool ok = 1;
  string error = 2;
  string run_id = 3;
  string state = 4;
  int32 next_step = 5;
  repeated string applied = 6;
}

message RunGetRequest {
  string run_id = 1;
}

message RunResumeRequest {
  string run_id = 1;
  Modes modes = 2;
}

message TxnRequest {
  string txn_id = 1;
  bytes key_a = 2;
  bytes value_a = 3;
  bytes key_b = 4;
  bytes value_b = 5;
  Modes modes = 6;
}

message TxnResponse {
  bool ok = 1;
  string error = 2;
  string txn_id = 3;
  string state = 4;
}

message ReplicateRequest {
  bytes key = 1;
  bytes value = 2;
  string kind = 3;
  int64 index = 4;
  bytes snapshot_blob = 5;
  string source = 6;
  Modes modes = 7;
  bytes meta = 8;
}

message ReplicateResponse {
  bool ok = 1;
  string error = 2;
  int64 applied_index = 3;
}

message ElectRequest {
  string candidate = 1;
  int32 term = 2;
  Modes modes = 3;
}

message ElectResponse {
  bool ok = 1;
  bool granted = 2;
  string leader = 3;
  int32 term = 4;
  string error = 5;
}

message PrepareRequest {
  string txn_id = 1;
  bytes key = 2;
  bytes value = 3;
}

message PrepareResponse {
  bool ok = 1;
  string error = 2;
}

message CommitRequest {
  string txn_id = 1;
}

message AbortRequest {
  string txn_id = 1;
}

message AckResponse {
  bool ok = 1;
  string error = 2;
}

service Node {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Fault(FaultRequest) returns (StatusResponse);
  rpc Write(WriteRequest) returns (WriteResponse);
  rpc Read(ReadRequest) returns (ReadResponse);
  rpc AddNode(AddNodeRequest) returns (StatusResponse);
  rpc Rebalance(RebalanceRequest) returns (StatusResponse);
  rpc RunStart(RunStartRequest) returns (RunResponse);
  rpc RunGet(RunGetRequest) returns (RunResponse);
  rpc RunResume(RunResumeRequest) returns (RunResponse);
  rpc Txn(TxnRequest) returns (TxnResponse);
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);
  rpc Elect(ElectRequest) returns (ElectResponse);
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
  rpc Commit(CommitRequest) returns (AckResponse);
  rpc Abort(AbortRequest) returns (AckResponse);
}
